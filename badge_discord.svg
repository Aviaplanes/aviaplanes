<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72">
  <defs>
    <style>
      .btn { cursor: pointer; }
      .bg { transition: fill 0.3s ease; }
      .btn:hover .bg { fill: #140505; }
      .main-text { transition: fill 0.3s ease; }
      .btn:hover .main-text { fill: #ff3333; filter: drop-shadow(0 0 4px #ff0000); }
      
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .dash-anim { animation: dash 2s linear infinite; }
      
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; filter: drop-shadow(0 0 3px #ff3333); } }
      .eye { animation: pulse 2s ease-in-out infinite; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .status { animation: blink 1.5s step-end infinite; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g class="btn">
    <rect class="bg" width="360" height="72" fill="#090a0f" rx="4" />
    <rect x="2" y="2" width="356" height="68" fill="none" stroke="#2a0000" stroke-width="2" rx="4" />
    <rect x="6" y="6" width="348" height="60" fill="none" stroke="#ff3333" stroke-width="1.5" opacity="0.8" rx="2" filter="url(#glow)" />
    <rect class="dash-anim" x="10" y="10" width="340" height="52" fill="none" stroke="#5a0000" stroke-width="1.5" stroke-dasharray="8,8" rx="2" />

    <path d="M6,16 L6,6 L16,6 M354,16 L354,6 L344,6 M6,56 L6,66 L16,66 M354,56 L354,66 L344,66" fill="none" stroke="#ff3333" stroke-width="2" />

    <line x1="84" y1="12" x2="84" y2="60" stroke="#ff3333" stroke-width="1.5" opacity="0.4" />
    <polygon points="84,12 80,18 88,18" fill="#ff3333" />
    <polygon points="84,60 80,54 88,54" fill="#ff3333" />

    <g transform="translate(44, 36)">
      <path d="M -16,-10 Q -16,-14 -12,-14 L 12,-14 Q 16,-14 16,-10 L 16,6 Q 16,10 12,10 L 4,10 L 0,16 L -4,10 L -12,10 Q -16,10 -16,6 Z" fill="#090a0f" stroke="#ff3333" stroke-width="2" />
      <circle class="eye" cx="-6" cy="-2" r="3" fill="#ff3333" />
      <circle class="eye" cx="6" cy="-2" r="3" fill="#ff3333" />
      <path d="M -8,-14 L -12,-20 M 8,-14 L 12,-20" stroke="#ff3333" stroke-width="2" stroke-linecap="round" />
      <circle class="status" cx="14" cy="8" r="5" fill="#090a0f" stroke="#ff3333" stroke-width="1.5" />
      <circle class="status" cx="14" cy="8" r="2" fill="#ff3333" filter="url(#glow)" />
    </g>

    <text x="222" y="30" font-family="'Courier New', monospace" font-size="16" fill="#ff4444" letter-spacing="3" text-anchor="middle" font-weight="bold">DISCORD</text>
    <text class="main-text" x="222" y="54" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="1" text-anchor="middle">JOIN SERVER</text>
  </g>
</svg>
