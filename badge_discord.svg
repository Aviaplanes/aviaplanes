<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36">

  <!-- ФОН -->
  <rect width="180" height="36" fill="#090a0f" />

  <!-- РАМКИ -->
  <rect x="1" y="1" width="178" height="34" fill="none" stroke="#2a0000" stroke-width="1" />
  <rect x="4" y="4" width="172" height="28" fill="none" stroke="#ff3333" stroke-width="1" />
  <rect x="7" y="7" width="166" height="22" fill="none" stroke="#3a0000" stroke-width="1" stroke-dasharray="3,2" />

  <!-- УГОЛ: верхний левый -->
  <polygon points="4,4 16,4 4,16" fill="#ff3333" />
  <polygon points="4,4 10,4 4,10" fill="#ffffff" />
  <line x1="16" y1="4" x2="28" y2="4" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="4" y1="16" x2="4" y2="28" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="28,4 31,2 34,4 31,6" fill="#8b0000" />

  <!-- УГОЛ: верхний правый -->
  <polygon points="176,4 164,4 176,16" fill="#ff3333" />
  <polygon points="176,4 170,4 176,10" fill="#ffffff" />
  <line x1="164" y1="4" x2="152" y2="4" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="176" y1="16" x2="176" y2="28" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="152,4 149,2 146,4 149,6" fill="#8b0000" />

  <!-- УГОЛ: нижний левый -->
  <polygon points="4,32 16,32 4,20" fill="#ff3333" />
  <polygon points="4,32 10,32 4,26" fill="#ffffff" />
  <line x1="16" y1="32" x2="28" y2="32" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="4" y1="20" x2="4" y2="14" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="28,32 31,34 34,32 31,30" fill="#8b0000" />

  <!-- УГОЛ: нижний правый -->
  <polygon points="176,32 164,32 176,20" fill="#ff3333" />
  <polygon points="176,32 170,32 176,26" fill="#ffffff" />
  <line x1="164" y1="32" x2="152" y2="32" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="176" y1="20" x2="176" y2="14" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="152,32 149,34 146,32 149,30" fill="#8b0000" />

  <!-- РАЗДЕЛИТЕЛЬ -->
  <line x1="42" y1="7" x2="42" y2="29" stroke="#ff3333" stroke-width="1" opacity="0.5" />
  <polygon points="42,7 40,10 44,10" fill="#ff3333" />
  <polygon points="42,29 40,26 44,26" fill="#ff3333" />

  <!-- ИКОНКА DISCORD (геометрическая, кастомная) -->
  <g transform="translate(24, 18)">
    <!-- Корпус (трапеция с закруглением через path) -->
    <path d="M -8,-6 Q -8,-8 -6,-8 L 6,-8 Q 8,-8 8,-6 L 8,4 Q 8,6 6,6 L 2,6 L 0,9 L -2,6 L -6,6 Q -8,6 -8,4 Z" fill="none" stroke="#ff3333" stroke-width="1.2" />
    <!-- Глаза (два ромба) -->
    <polygon points="-3,-2 -1,-4 1,-2 -1,0" fill="#ff3333" />
    <polygon points="3,-2 5,-4 7,-2 5,0" fill="#ff3333" />
    <!-- Рот (черта) -->
    <line x1="-4" y1="3" x2="4" y2="3" stroke="#8b0000" stroke-width="1" />
    <!-- Антенны -->
    <line x1="-5" y1="-8" x2="-7" y2="-11" stroke="#ff3333" stroke-width="1" />
    <polygon points="-7,-11 -9,-13 -5,-13" fill="#ff3333" />
    <line x1="5" y1="-8" x2="7" y2="-11" stroke="#ff3333" stroke-width="1" />
    <polygon points="7,-11 5,-13 9,-13" fill="#ff3333" />
  </g>

  <!-- ТЕКСТ -->
  <text
    x="110" y="15"
    font-family="Georgia, serif"
    font-size="8"
    fill="#5a0000"
    letter-spacing="2"
    text-anchor="middle"
  >DISCORD</text>

  <text
    x="110" y="27"
    font-family="Courier New, monospace"
    font-size="10"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="1"
    text-anchor="middle"
  >JOIN SERVER</text>

</svg>
