<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36">
  <defs>
    <style>
      .btn { cursor: pointer; }
      .bg { transition: fill 0.3s ease; }
      .btn:hover .bg { fill: #140505; }
      
      .main-text { transition: fill 0.3s ease; }
      .btn:hover .main-text { fill: #ff3333; }
      
      /* Анимация бегущего пунктира */
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .dash-anim { animation: dash 2s linear infinite; }
      
      /* Пульсация глаз Discord */
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; filter: drop-shadow(0 0 2px #ff3333); } }
      .eye { animation: pulse 2s ease-in-out infinite; }
      
      /* Мигание индикатора */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .status { animation: blink 1.5s step-end infinite; }
    </style>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g class="btn">
    <!-- ФОН -->
    <rect class="bg" width="180" height="36" fill="#090a0f" rx="2" />
    
    <!-- РАМКИ -->
    <rect x="1" y="1" width="178" height="34" fill="none" stroke="#2a0000" stroke-width="1" rx="2" />
    <rect x="3" y="3" width="174" height="30" fill="none" stroke="#ff3333" stroke-width="1" opacity="0.8" rx="1" filter="url(#glow)" />
    <rect class="dash-anim" x="5" y="5" width="170" height="26" fill="none" stroke="#5a0000" stroke-width="1" stroke-dasharray="4,4" rx="1" />

    <!-- УГЛЫ (Минимализм) -->
    <path d="M3,8 L3,3 L8,3 M177,8 L177,3 L172,3 M3,28 L3,33 L8,33 M177,28 L177,33 L172,33" fill="none" stroke="#ff3333" stroke-width="1.5" />

    <!-- РАЗДЕЛИТЕЛЬ -->
    <line x1="40" y1="6" x2="40" y2="30" stroke="#ff3333" stroke-width="1" opacity="0.4" />
    <polygon points="40,6 38,9 42,9" fill="#ff3333" />
    <polygon points="40,30 38,27 42,27" fill="#ff3333" />

    <!-- ИКОНКА DISCORD (Стилизованный Clyde) -->
    <g transform="translate(21, 18)">
      <!-- Корпус -->
      <path d="M -8,-5 Q -8,-7 -6,-7 L 6,-7 Q 8,-7 8,-5 L 8,3 Q 8,5 6,5 L 2,5 L 0,8 L -2,5 L -6,5 Q -8,5 -8,3 Z" fill="#090a0f" stroke="#ff3333" stroke-width="1.2" />
      <!-- Глаза -->
      <circle class="eye" cx="-3" cy="-1" r="1.5" fill="#ff3333" />
      <circle class="eye" cx="3" cy="-1" r="1.5" fill="#ff3333" />
      <!-- Антенны -->
      <path d="M -4,-7 L -6,-10 M 4,-7 L 6,-10" stroke="#ff3333" stroke-width="1.2" stroke-linecap="round" />
      <!-- Индикатор Online -->
      <circle class="status" cx="7" cy="4" r="2.5" fill="#090a0f" stroke="#ff3333" stroke-width="1" />
      <circle class="status" cx="7" cy="4" r="1" fill="#ff3333" filter="url(#glow)" />
    </g>

    <!-- ТЕКСТ -->
    <!-- Цвет изменен на #ff4444 для идеальной читаемости -->
    <text x="110" y="14" font-family="'Courier New', monospace" font-size="8" fill="#ff4444" letter-spacing="2" text-anchor="middle" font-weight="bold">DISCORD</text>
    <text class="main-text" x="110" y="27" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1" text-anchor="middle">JOIN SERVER</text>
  </g>
</svg>
