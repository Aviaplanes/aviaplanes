<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="ghosted.">
  <title>ghosted.</title>
  <desc>Ультражирная светящаяся надпись ghosted. на прозрачном фоне: призрачное дыхание букв и бегущий блик.</desc>

  <defs>
    <!-- вертикальный градиент букв -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="224">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4f2"/>
    </linearGradient>

    <!-- бегущий блик по слову -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-790 0; 790 0; 790 0" keyTimes="0; 0.4; 1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- дышащее свечение: сам blur анимируется -->
    <filter id="glow" x="-45%" y="-90%" width="190%" height="280%">
      <feGaussianBlur stdDeviation="15">
        <animate attributeName="stdDeviation" values="13;24;13" dur="6.5s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      </feGaussianBlur>
    </filter>

    <!-- слово: каждая буква — призрак со своей фазой -->
    <g id="word" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',-apple-system,Arial,sans-serif"
       font-size="120" font-weight="900" text-anchor="middle">

      <g opacity="0">
        <animate attributeName="opacity" begin="0.55s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="0.55s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-0.4s" dur="5.6s" values="0 0; 0 -7; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="185" y="192">g<animate attributeName="opacity" values="1;0.55;1" dur="5.6s"
            begin="-0.4s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="0.67s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="0.67s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-0.8s" dur="5.6s" values="0 0; 0 -6; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="285" y="192">h<animate attributeName="opacity" values="1;0.6;1" dur="6.3s"
            begin="-2.1s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="0.79s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="0.79s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-1.6s" dur="5.6s" values="0 0; 0 -8; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="385" y="192">o<animate attributeName="opacity" values="1;0.5;1" dur="5.1s"
            begin="-1.2s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="0.91s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="0.91s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-2.4s" dur="5.6s" values="0 0; 0 -7; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="485" y="192">s<animate attributeName="opacity" values="1;0.62;1" dur="6.9s"
            begin="-3.3s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="1.03s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="1.03s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-3.2s" dur="5.6s" values="0 0; 0 -6; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="585" y="192">t<animate attributeName="opacity" values="1;0.58;1" dur="5.4s"
            begin="-0.7s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="1.15s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="1.15s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-4s" dur="5.6s" values="0 0; 0 -8; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="685" y="192">e<animate attributeName="opacity" values="1;0.52;1" dur="6.1s"
            begin="-4.5s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" begin="1.27s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="1.27s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-4.8s" dur="5.6s" values="0 0; 0 -7; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="785" y="192">d<animate attributeName="opacity" values="1;0.6;1" dur="5.9s"
            begin="-1.9s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>

      <!-- точка -->
      <g opacity="0">
        <animate attributeName="opacity" begin="1.39s" dur="1s" values="0;1" fill="freeze"
          calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="1.39s" dur="1.1s" values="0 22; 0 0" fill="freeze"
            calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
          <animateTransform attributeName="transform" type="translate" additive="sum"
            begin="-5.6s" dur="5.6s" values="0 0; 0 -6; 0 0" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          <text x="840" y="192">.<animate attributeName="opacity" values="1;0.58;1" dur="5.8s"
            begin="-2.6s" repeatCount="indefinite" calcMode="spline"
            keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/></text>
        </g>
      </g>
    </g>
  </defs>

  <!-- слово: дышащее свечение + сами буквы + бегущий блик -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="9s"
      repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="1;0.75;1" dur="12s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- дышащее свечение -->
    <use xlink:href="#word" href="#word" fill="#ffffff" filter="url(#glow)" opacity="0.5">
      <animate attributeName="opacity" values="0.38;0.8;0.38" dur="6.5s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </use>

    <!-- сами буквы -->
    <use xlink:href="#word" href="#word" fill="url(#ink)"/>

    <!-- бегущий блик -->
    <use xlink:href="#word" href="#word" fill="url(#sheen)"/>
  </g>
</svg>
