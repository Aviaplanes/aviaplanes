<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="30%" stop-color="#8b0000" />
      <stop offset="50%" stop-color="#ff3333" />
      <stop offset="70%" stop-color="#8b0000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="bar-python" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#8b0000" />
    </linearGradient>

    <linearGradient id="bar-js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc2222" />
      <stop offset="100%" stop-color="#5a0000" />
    </linearGradient>

    <linearGradient id="bar-rust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>

    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0000" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0d0000" />
    </linearGradient>

    <!-- Фильтр красного свечения -->
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Фильтр белого свечения -->
    <filter id="glow-white">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Фильтр мягкого свечения для фона -->
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!--                    ФОН                      -->
  <!-- ═══════════════════════════════════════════ -->
  <rect width="500" height="240" fill="url(#bg-gradient)" />

  <!-- Фоновый красный ореол по центру -->
  <ellipse cx="250" cy="120" rx="180" ry="80" fill="#3a0000" opacity="0.15" filter="url(#glow-soft)" />

  <!-- ═══════════════════════════════════════════ -->
  <!--                   РАМКИ                     -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Самая внешняя рамка (еле видимая) -->
  <rect x="2" y="2" width="496" height="236" fill="none" stroke="#2a0000" stroke-width="1" />

  <!-- Основная рамка с красным свечением -->
  <rect x="8" y="8" width="484" height="224" fill="none" stroke="#ff3333" stroke-width="1.5" filter="url(#glow-red)" opacity="0.9" />

  <!-- Внутренняя декоративная рамка -->
  <rect x="14" y="14" width="472" height="212" fill="none" stroke="#5a0000" stroke-width="1" stroke-dasharray="4,3" />

  <!-- ═══════════════════════════════════════════ -->
  <!--          ГОТИЧЕСКИЕ УГЛОВЫЕ ЭЛЕМЕНТЫ        -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ╔═ ВЕРХНИЙ ЛЕВЫЙ УГОЛ ═╗ -->
  <!-- Основной шип -->
  <polygon points="8,8 28,8 8,28" fill="#ff3333" filter="url(#glow-red)" />
  <!-- Внутренний белый акцент -->
  <polygon points="8,8 18,8 8,18" fill="#ffffff" opacity="0.9" />
  <!-- Декоративные линии из угла -->
  <line x1="8" y1="8" x2="45" y2="8" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="8" y1="8" x2="8" y2="45" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <!-- Маленький ромб на линии -->
  <polygon points="45,8 50,5 55,8 50,11" fill="#8b0000" />
  <polygon points="8,45 5,50 8,55 11,50" fill="#8b0000" />

  <!-- ╗ ВЕРХНИЙ ПРАВЫЙ УГОЛ ═ -->
  <polygon points="492,8 472,8 492,28" fill="#ff3333" filter="url(#glow-red)" />
  <polygon points="492,8 482,8 492,18" fill="#ffffff" opacity="0.9" />
  <line x1="492" y1="8" x2="455" y2="8" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="492" y1="8" x2="492" y2="45" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="455,8 450,5 445,8 450,11" fill="#8b0000" />
  <polygon points="492,45 489,50 492,55 495,50" fill="#8b0000" />

  <!-- ╚═ НИЖНИЙ ЛЕВЫЙ УГОЛ ═╝ -->
  <polygon points="8,232 28,232 8,212" fill="#ff3333" filter="url(#glow-red)" />
  <polygon points="8,232 18,232 8,222" fill="#ffffff" opacity="0.9" />
  <line x1="8" y1="232" x2="45" y2="232" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="8" y1="232" x2="8" y2="195" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="45,232 50,235 55,232 50,229" fill="#8b0000" />
  <polygon points="8,195 5,190 8,185 11,190" fill="#8b0000" />

  <!-- ╝ НИЖНИЙ ПРАВЫЙ УГОЛ -->
  <polygon points="492,232 472,232 492,212" fill="#ff3333" filter="url(#glow-red)" />
  <polygon points="492,232 482,232 492,222" fill="#ffffff" opacity="0.9" />
  <line x1="492" y1="232" x2="455" y2="232" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <line x1="492" y1="232" x2="492" y2="195" stroke="#ff3333" stroke-width="1" opacity="0.6" />
  <polygon points="455,232 450,235 445,232 450,229" fill="#8b0000" />
  <polygon points="492,195 489,190 492,185 495,190" fill="#8b0000" />

  <!-- ═══════════════════════════════════════════ -->
  <!--         ЦЕНТРАЛЬНЫЙ ГОТИЧЕСКИЙ ОРНАМЕНТ     -->
  <!--              (верх карточки)                -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Центральный крест-кинжал сверху -->
  <g transform="translate(250, 8)" filter="url(#glow-red)">
    <!-- Вертикаль кинжала -->
    <line x1="0" y1="-4" x2="0" y2="12" stroke="#ff3333" stroke-width="2" />
    <!-- Гарда (горизонталь) -->
    <line x1="-8" y1="4" x2="8" y2="4" stroke="#ff3333" stroke-width="1.5" />
    <!-- Навершие -->
    <polygon points="0,-4 3,-10 0,-8 -3,-10" fill="#ff3333" />
    <!-- Острие -->
    <polygon points="0,12 -2,9 2,9" fill="#ffffff" />
  </g>

  <!-- Левый орнамент (завиток из ромбов) -->
  <g opacity="0.7">
    <polygon points="140,8 144,5 148,8 144,11" fill="#ff3333" filter="url(#glow-red)" />
    <polygon points="160,8 163,6 166,8 163,10" fill="#8b0000" />
    <polygon points="175,8 177,6 179,8 177,10" fill="#5a0000" />
  </g>

  <!-- Правый орнамент (зеркальный) -->
  <g opacity="0.7">
    <polygon points="360,8 356,5 352,8 356,11" fill="#ff3333" filter="url(#glow-red)" />
    <polygon points="340,8 337,6 334,8 337,10" fill="#8b0000" />
    <polygon points="325,8 323,6 321,8 323,10" fill="#5a0000" />
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!--                  ЗАГОЛОВОК                  -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Декоративная линия над заголовком -->
  <line x1="80" y1="42" x2="420" y2="42" stroke="url(#red-glow)" stroke-width="1" />

  <!-- Маленькие засечки на линии -->
  <line x1="80" y1="39" x2="80" y2="45" stroke="#ff3333" stroke-width="1.5" />
  <line x1="420" y1="39" x2="420" y2="45" stroke="#ff3333" stroke-width="1.5" />
  <polygon points="250,39 253,43 250,47 247,43" fill="#ff3333" filter="url(#glow-red)" />

  <!-- Основной заголовок -->
  <text
    x="250" y="62"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="14"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="5"
    text-anchor="middle"
    filter="url(#glow-white)"
  >SYSTEM // LANGUAGES</text>

  <!-- Подзаголовок (руническая строка) -->
  <text
    x="250" y="76"
    font-family="'Courier New', monospace"
    font-size="8"
    fill="#5a0000"
    letter-spacing="3"
    text-anchor="middle"
  >ᚷᛟᛏᚺᛁᚲ · ᚱᚢᚾᛖᛋ · ᚨᚲᛏᛁᚹᛖ</text>

  <!-- Декоративная линия под заголовком -->
  <line x1="80" y1="83" x2="420" y2="83" stroke="url(#red-glow)" stroke-width="1" />

  <!-- ═══════════════════════════════════════════ -->
  <!--                СТРОКИ ЯЗЫКОВ                -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ── Python 84.62% ── -->
  <g transform="translate(35, 108)">
    <!-- Ромб-маркер -->
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#ff3333" filter="url(#glow-red)" />
    <!-- Внутренний ромб -->
    <polygon points="0,-2.5 2.5,0 0,2.5 -2.5,0" fill="#ffffff" />
    <!-- Название языка -->
    <text x="14" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1">Python</text>
    <!-- Процент -->
    <text x="108" y="4" font-family="'Courier New', monospace" font-size="11" fill="#ff3333" filter="url(#glow-red)" font-weight="bold">84.62%</text>
    <!-- Декоративная точка-разделитель -->
    <text x="96" y="4" font-family="'Courier New', monospace" font-size="11" fill="#5a0000">·</text>
    <!-- Шкала (фон) -->
    <rect x="170" y="-7" width="280" height="10" fill="#0d0d0d" stroke="#2a0000" stroke-width="1" />
    <!-- Шкала (заполнение) -->
    <rect x="170" y="-7" width="237" height="10" fill="url(#bar-python)" />
    <!-- Засечки на шкале -->
    <line x1="170" y1="-9" x2="170" y2="5" stroke="#ff3333" stroke-width="1" />
    <line x1="450" y1="-9" x2="450" y2="5" stroke="#5a0000" stroke-width="1" />
    <!-- Свечение конца полосы -->
    <rect x="405" y="-7" width="2" height="10" fill="#ff6666" opacity="0.8" filter="url(#glow-red)" />
  </g>

  <!-- ── JavaScript 14.19% ── -->
  <g transform="translate(35, 145)">
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#8b0000" />
    <polygon points="0,-2.5 2.5,0 0,2.5 -2.5,0" fill="#cc4444" />
    <text x="14" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c9d1d9" letter-spacing="1">JavaScript</text>
    <text x="108" y="4" font-family="'Courier New', monospace" font-size="11" fill="#cc4444" font-weight="bold">14.19%</text>
    <text x="96" y="4" font-family="'Courier New', monospace" font-size="11" fill="#5a0000">·</text>
    <rect x="170" y="-7" width="280" height="10" fill="#0d0d0d" stroke="#2a0000" stroke-width="1" />
    <rect x="170" y="-7" width="40" height="10" fill="url(#bar-js)" />
    <line x1="170" y1="-9" x2="170" y2="5" stroke="#8b0000" stroke-width="1" />
    <line x1="450" y1="-9" x2="450" y2="5" stroke="#5a0000" stroke-width="1" />
    <rect x="208" y="-7" width="2" height="10" fill="#cc2222" opacity="0.8" />
  </g>

  <!-- ── Rust 0.67% ── -->
  <g transform="translate(35, 182)">
    <!-- Белый ромб для Rust (сталь) -->
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#ffffff" filter="url(#glow-white)" />
    <polygon points="0,-2.5 2.5,0 0,2.5 -2.5,0" fill="#ff3333" />
    <text x="14" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1" filter="url(#glow-white)">Rust</text>
    <text x="108" y="4" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold" filter="url(#glow-white)">0.67%</text>
    <text x="96" y="4" font-family="'Courier New', monospace" font-size="11" fill="#5a0000">·</text>
    <rect x="170" y="-7" width="280" height="10" fill="#0d0d0d" stroke="#2a0000" stroke-width="1" />
    <rect x="170" y="-7" width="3" height="10" fill="url(#bar-rust)" filter="url(#glow-white)" />
    <line x1="170" y1="-9" x2="170" y2="5" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <line x1="450" y1="-9" x2="450" y2="5" stroke="#5a0000" stroke-width="1" />
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!--               НИЖНИЙ ОРНАМЕНТ               -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Линия над футером -->
  <line x1="80" y1="210" x2="420" y2="210" stroke="url(#red-glow)" stroke-width="1" />

  <!-- Нижний центральный элемент -->
  <g transform="translate(250, 232)" filter="url(#glow-red)">
    <line x1="0" y1="4" x2="0" y2="-4" stroke="#ff3333" stroke-width="2" />
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#ff3333" stroke-width="1.5" />
    <polygon points="0,4 -2,1 2,1" fill="#ffffff" />
  </g>

  <!-- Нижний текст (версия/подпись) -->
  <text
    x="250" y="224"
    font-family="'Courier New', monospace"
    font-size="7"
    fill="#3a0000"
    letter-spacing="4"
    text-anchor="middle"
  >// NO MERCY · PROPRIETARY · LOCKED //</text>

  <!-- Левый нижний орнамент -->
  <g opacity="0.7">
    <polygon points="140,232 144,229 148,232 144,235" fill="#ff3333" filter="url(#glow-red)" />
    <polygon points="160,232 163,230 166,232 163,234" fill="#8b0000" />
    <polygon points="175,232 177,230 179,232 177,234" fill="#5a0000" />
  </g>

  <!-- Правый нижний орнамент -->
  <g opacity="0.7">
    <polygon points="360,232 356,229 352,232 356,235" fill="#ff3333" filter="url(#glow-red)" />
    <polygon points="340,232 337,230 334,232 337,234" fill="#8b0000" />
    <polygon points="325,232 323,230 321,232 323,234" fill="#5a0000" />
  </g>

</svg>
