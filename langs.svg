<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
  <defs>
    <!-- Градиент для готического свечения -->
    <linearGradient id="gothic-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0000" />
      <stop offset="50%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#3a0000" />
    </linearGradient>
  </defs>

  <!-- Фон (идеально темный, глубокий черный) -->
  <rect width="100%" height="100%" fill="#090a0f" rx="0" />

  <!-- Внешняя тонкая рамка -->
  <rect x="5" y="5" width="440" height="190" fill="none" stroke="#2a0808" stroke-width="1" />
  
  <!-- Внутренняя рамка с шипами/острыми углами -->
  <rect x="12" y="12" width="426" height="176" fill="none" stroke="#ff3333" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- ГОТИЧЕСКИЕ УГЛЫ (ШИПЫ) -->
  <!-- Топ-лево -->
  <path d="M 8,12 L 20,12 L 12,20 L 12,8 Z" fill="#ff3333" />
  <path d="M 12,12 L 28,12 M 12,12 L 12,28" stroke="#ffffff" stroke-width="1" />
  <!-- Топ-право -->
  <path d="M 442,12 L 430,12 L 438,20 L 438,8 Z" fill="#ff3333" />
  <path d="M 438,12 L 422,12 M 438,12 L 438,28" stroke="#ffffff" stroke-width="1" />
  <!-- Бот-лево -->
  <path d="M 8,188 L 20,188 L 12,180 L 12,192 Z" fill="#ff3333" />
  <path d="M 12,188 L 28,188 M 12,188 L 12,172" stroke="#ffffff" stroke-width="1" />
  <!-- Бот-право -->
  <path d="M 442,188 L 430,188 L 438,180 L 438,192 Z" fill="#ff3333" />
  <path d="M 438,188 L 422,188 M 438,188 L 438,172" stroke="#ffffff" stroke-width="1" />

  <!-- Декоративный крест/клинок по центру сверху -->
  <path d="M 225,5 L 225,19 M 220,10 L 230,10" stroke="#ff3333" stroke-width="1.5" />

  <!-- ЗАГОЛОВОК -->
  <text x="225" y="42" font-family="'Georgia', serif" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="3" text-anchor="middle">
    SYSTEM LANGUAGES
  </text>
  
  <line x1="150" y1="52" x2="300" y2="52" stroke="url(#gothic-red)" stroke-width="1.5" />

  <!-- ЯЗЫКИ (Статика) -->
  
  <!-- 1. Python (84.62%) -->
  <g transform="translate(40, 75)">
    <!-- Символ ромба вместо дефолтной точки -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#ff3333" />
    <text x="15" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c9d1d9">Python</text>
    <text x="110" y="4" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">84.6%</text>
    <!-- Шкала -->
    <rect x="160" y="-5" width="210" height="8" fill="#161b22" rx="0" />
    <rect x="160" y="-5" width="177" height="8" fill="#ff3333" rx="0" /> <!-- 177px = 84% -->
  </g>

  <!-- 2. JavaScript (14.19%) -->
  <g transform="translate(40, 110)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#800000" />
    <text x="15" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c9d1d9">JavaScript</text>
    <text x="110" y="4" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">14.2%</text>
    <!-- Шкала -->
    <rect x="160" y="-5" width="210" height="8" fill="#161b22" rx="0" />
    <rect x="160" y="-5" width="30" height="8" fill="#800000" rx="0" /> <!-- 30px = 14% -->
  </g>

  <!-- 3. Rust (1.2%) - Выделим белым/серебряным, как сталь -->
  <g transform="translate(40, 145)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#ffffff" />
    <text x="15" y="4" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ffffff">Rust</text>
    <text x="110" y="4" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">1.2%</text>
    <!-- Шкала -->
    <rect x="160" y="-5" width="210" height="8" fill="#161b22" rx="0" />
    <rect x="160" y="-5" width="4" height="8" fill="#ffffff" rx="0" /> <!-- 4px = 1.2% -->
  </g>

</svg>
