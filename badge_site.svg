<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72">
  <defs>
    <style>
      .btn { cursor: pointer; }
      .bg { transition: fill 0.3s ease; }
      .btn:hover .bg { fill: #140505; }
      .main-text { transition: fill 0.3s ease; }
      .btn:hover .main-text { fill: #ff3333; filter: drop-shadow(0 0 4px #ff0000); }
      
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .dash-anim { animation: dash 2s linear infinite; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globe-clip">
      <circle cx="44" cy="36" r="15" />
    </clipPath>
  </defs>

  <g class="btn">
    <rect class="bg" width="360" height="72" fill="#090a0f" rx="4" />
    <rect x="2" y="2" width="356" height="68" fill="none" stroke="#2a0000" stroke-width="2" rx="4" />
    <rect x="6" y="6" width="348" height="60" fill="none" stroke="#ff3333" stroke-width="1.5" opacity="0.8" rx="2" filter="url(#glow)" />
    <rect class="dash-anim" x="10" y="10" width="340" height="52" fill="none" stroke="#5a0000" stroke-width="1.5" stroke-dasharray="8,8" rx="2" />

    <path d="M6,16 L6,6 L16,6 M354,16 L354,6 L344,6 M6,56 L6,66 L16,66 M354,56 L354,66 L344,66" fill="none" stroke="#ff3333" stroke-width="2" />

    <line x1="84" y1="12" x2="84" y2="60" stroke="#ff3333" stroke-width="1.5" opacity="0.4" />
    <polygon points="84,12 80,18 88,18" fill="#ff3333" />
    <polygon points="84,60 80,54 88,54" fill="#ff3333" />

    <g transform="translate(0, 0)">
      <circle cx="44" cy="36" r="16" fill="#090a0f" stroke="#ff3333" stroke-width="2" />
      <ellipse cx="44" cy="36" rx="7" ry="16" fill="none" stroke="#8b0000" stroke-width="1.5" />
      <line x1="28" y1="36" x2="60" y2="36" stroke="#8b0000" stroke-width="1.5" />
      
      <g clip-path="url(#globe-clip)">
        <line x1="44" y1="36" x2="44" y2="20" stroke="#ff3333" stroke-width="2" filter="url(#glow)">
          <animateTransform attributeName="transform" type="rotate" from="0 44 36" to="360 44 36" dur="3s" repeatCount="indefinite" />
        </line>
        <path d="M44,36 L44,20 A16,16 0 0,0 32.7,24.7 Z" fill="#ff3333" opacity="0.2">
          <animateTransform attributeName="transform" type="rotate" from="0 44 36" to="360 44 36" dur="3s" repeatCount="indefinite" />
        </path>
      </g>
      <circle cx="44" cy="36" r="3" fill="#ffffff" filter="url(#glow)" />
    </g>

    <text x="222" y="30" font-family="'Courier New', monospace" font-size="16" fill="#ff4444" letter-spacing="3" text-anchor="middle" font-weight="bold">WEBSITE</text>
    <text class="main-text" x="222" y="54" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="1" text-anchor="middle">0xavia.xyz</text>
  </g>
</svg>
